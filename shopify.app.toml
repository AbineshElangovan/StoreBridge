# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "f82dbdee74418429d3510c35ca99aae3"
name = "StoreBridge"
application_url = "https://dz50mdfc-3000.inc1.devtunnels.ms"
embedded = true

[build]
automatically_update_urls_on_dev = false

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/api/webhooks/app-uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/api/webhooks/inventory-levels-update"
  topics = [ "inventory_levels/update" ]

  [[webhooks.subscriptions]]
  uri = "/api/webhooks/products-create"
  topics = [ "products/create" ]

  [[webhooks.subscriptions]]
  uri = "/api/webhooks/products-delete"
  topics = [ "products/delete" ]

  [[webhooks.subscriptions]]
  uri = "/api/webhooks/products-update"
  topics = [ "products/update" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_inventory,read_inventory,read_products,write_products,read_publications,write_publications"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [ "https://dz50mdfc-3000.inc1.devtunnels.ms/api/auth/callback" ]
