name: Shopify Token Health & Maintenance

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  token-maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger StoreBridge Token Maintenance
        run: |
          APP_URL="${{ secrets.STOREBRIDGE_APP_URL }}"
          CRON_SECRET="${{ secrets.CRON_SECRET }}"

          if [ -z "$APP_URL" ]; then
            echo "STOREBRIDGE_APP_URL secret is not set. Skipping ping."
            exit 0
          fi

          echo "Pinging $APP_URL/api/cron/health..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X GET "$APP_URL/api/cron/health" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "User-Agent: GitHub-Actions-TokenMaintenance")

          HTTP_BODY=$(echo "$RESPONSE" | sed -e '$d')
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1 | cut -d':' -f2)

          echo "Response Status: $HTTP_STATUS"
          echo "Response Body: $HTTP_BODY"

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Token maintenance ping returned status $HTTP_STATUS"
            exit 1
          fi

